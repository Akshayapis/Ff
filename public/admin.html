<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Host Zone – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#2563eb;--bg:#f1f3f6;--navy:#0f172a;--text:#0f172a;--muted:#64748b;--green:#16a34a;--red:#dc2626;--amber:#d97706;--line:#e2e8f0;--sh:0 4px 18px rgba(15,23,42,.07)}
*{box-sizing:border-box}
html,body{margin:0;font-family:'Poppins',system-ui,sans-serif;font-size:13.5px;color:var(--text);background:var(--bg)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--text)}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f172a,#1e3a8a)}
.login .box{background:#fff;border-radius:24px;padding:30px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login h1{margin:0 0 4px;font-size:22px;color:var(--blue)}.login p{margin:0 0 20px;color:var(--muted)}
/* layout */
.app{display:flex;min-height:100vh}
.side{width:236px;background:var(--navy);color:#cbd5e1;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .25s}
.side .lg{padding:20px 18px;font-weight:700;font-size:18px;color:#fff;display:flex;align-items:center;gap:10px}
.side .lg i{width:34px;height:34px;border-radius:10px;background:var(--blue);display:grid;place-items:center;font-style:normal;overflow:hidden}
.side .lg i img{width:100%;height:100%;object-fit:cover}
.side nav{flex:1;overflow:auto;padding:4px 10px}
.side nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;color:#cbd5e1;font-weight:500;margin-bottom:2px;text-align:left;transition:.15s}
.side nav button:hover{background:rgba(255,255,255,.07)}
.side nav button.on{background:var(--blue);color:#fff}
.side .ft{padding:12px 14px;border-top:1px solid rgba(255,255,255,.1);font-size:12px}
.main{flex:1;margin-left:236px;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;box-shadow:var(--sh);position:sticky;top:0;z-index:40}
.top h2{margin:0;font-size:18px;flex:1}
.burger{display:none;width:38px;height:38px;border-radius:10px;background:#f1f5f9;place-items:center}
.content{padding:22px;max-width:1300px}
.scrim{display:none}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none}.main{margin-left:0}.burger{display:grid}.content{padding:14px}.scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}}
/* ui */
.card{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:18px;margin-bottom:18px}
.card h3{margin:0 0 14px;font-size:15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sh);border-left:5px solid var(--blue)}
.stat small{color:var(--muted);font-weight:500;display:block}.stat b{font-size:22px;display:block;margin-top:2px}
.stat.g{border-color:var(--green)}.stat.r{border-color:var(--red)}.stat.a{border-color:var(--amber)}.stat.p{border-color:#7c3aed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:11px;background:var(--blue);color:#fff;font-weight:600;font-size:13px;transition:.15s}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:9px}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.o{background:#e2e8f0;color:#334155}.btn.a{background:var(--amber)}.btn.p{background:#7c3aed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.row .sp{flex:1}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea,.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;outline:0}
.fld input:focus,.fld select:focus,.fld textarea:focus,.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.in{width:auto;min-width:130px}
.fld small{color:var(--muted);font-size:11px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.tw{overflow-x:auto;border-radius:14px}
table{width:100%;border-collapse:collapse;background:#fff}
th{background:#f8fafc;text-align:left;font-size:11px;letter-spacing:.4px;color:var(--muted);padding:10px 12px;white-space:nowrap;text-transform:uppercase}
td{padding:10px 12px;border-top:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#fafcff}
.bd{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600;text-transform:capitalize}
.bd.success,.bd.paid,.bd.completed,.bd.active,.bd.credited,.bd.verified{background:#dcfce7;color:#15803d}
.bd.pending,.bd.approved,.bd.upcoming{background:#fef9c3;color:#a16207}
.bd.ongoing{background:#dbeafe;color:#1d4ed8}
.bd.failed,.bd.rejected,.bd.expired,.bd.cancelled,.bd.banned{background:#fee2e2;color:#b91c1c}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#e2e8f0}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:999px;background:#fff;font-weight:600;font-size:12.5px;color:var(--muted);box-shadow:var(--sh)}
.tabs button.on{background:var(--blue);color:#fff}
.mbg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;animation:f .2s}
@keyframes f{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:u .25s}
.modal.w{max-width:900px}
@keyframes u{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin:0 0 16px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.modal h3 button{width:30px;height:30px;border-radius:50%;background:#f1f5f9;display:grid;place-items:center}
.toasts{position:fixed;top:14px;right:14px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:u .25s;max-width:360px}
.toast.ok{background:#15803d}.toast.bad{background:#b91c1c}
.sk{height:90px;border-radius:16px;margin-bottom:12px;background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 37%,#e5e7eb 63%);background-size:400% 100%;animation:sk 1.3s infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.chart{display:flex;align-items:flex-end;gap:4px;height:180px;padding-top:10px;overflow-x:auto}
.chart .col{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .bars{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.chart .bars i{display:block;width:30%;min-width:4px;border-radius:4px 4px 0 0}
.chart small{font-size:9px;color:var(--muted);margin-top:4px;white-space:nowrap}
.lg-d{display:flex;gap:14px;font-size:12px;margin-bottom:6px;flex-wrap:wrap}.lg-d i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.pre{background:#f8fafc;border-radius:12px;padding:12px;font-size:12.5px}
.pre div{display:flex;justify-content:space-between;padding:3px 0}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.mut{color:var(--muted)}.pos{color:var(--green);font-weight:600}.neg{color:var(--red);font-weight:600}
.chk{width:18px;height:18px;accent-color:var(--blue)}
.imgp{display:flex;align-items:center;gap:12px}.imgp img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#e2e8f0}
.sw{display:flex;align-items:center;gap:8px;font-weight:500}.sw input{width:18px;height:18px;accent-color:var(--blue)}
</style>
</head>
<body>
<div id="login" class="login hidden">
  <form class="box" id="lf">
    <h1>Host Zone Admin</h1><p>Sign in to manage tournaments</p>
    <div class="fld"><label>Username</label><input id="lu" autocomplete="username" required></div>
    <div class="fld"><label>Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%;padding:12px" id="lb">LOGIN</button>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side" id="side">
    <div class="lg"><i id="slogo">HZ</i><span id="sname">Host Zone</span></div>
    <nav id="nav"></nav>
    <div class="ft"><div class="mut" style="margin-bottom:8px">Signed in as <b id="who" style="color:#fff"></b></div>
      <button class="btn sm o" id="chpw" style="width:100%;margin-bottom:6px">Change password</button>
      <button class="btn sm r" id="lo" style="width:100%">Logout</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="top"><button class="burger" id="burger" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><h2 id="title">Dashboard</h2><button class="btn sm o" id="rf">↻ Refresh</button></div>
    <div class="content" id="pg"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script>
'use strict';
/* Host Zone admin panel. Talks only to /api/admin/* with a separate admin JWT. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inr = (n) => '₹' + (Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2 });
const fmt = (d) => d ? new Date(d).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true }) + ' IST' : '—';
const LS = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* ignore */ } }, del: (k) => { try { localStorage.removeItem(k); } catch { /* ignore */ } } };
const A = { token: LS.get('hz_admin'), name: '' };
const bd = (s) => `<span class="bd ${esc(s)}">${esc(s)}</span>`;
const bdx = (c, t) => `<span class="bd ${esc(c)}">${esc(t)}</span>`;
const sk = (n = 3) => Array.from({ length: n }, () => '<div class="sk"></div>').join('');
const emptyBox = (t, s) => `<div class="empty"><b>${t}</b>${s || ''}</div>`;
const tbl = (cols, rows, empty) => rows.length ? `<div class="tw"><table><thead><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : emptyBox(empty || 'Nothing here yet');

async function api(path, o = {}) {
  let r;
  try { r = await fetch('/api' + path, { method: o.method || 'GET', headers: { 'Content-Type': 'application/json', ...(A.token ? { Authorization: 'Bearer ' + A.token } : {}) }, body: o.body ? JSON.stringify(o.body) : undefined }); }
  catch { throw new Error('Network error. Check your connection.'); }
  if (o.raw && r.ok) return r;
  let j = null; try { j = await r.json(); } catch { /* ignore */ }
  if (!j) throw new Error('Server error');
  if (!j.success) { const e = new Error(j.message); e.status = r.status; if (r.status === 401 && A.token && path !== '/admin/login') { doLogout(true); } throw e; }
  return j;
}
function toast(m, t) { const d = document.createElement('div'); d.className = 'toast ' + (t || ''); d.textContent = m; $('#toasts').appendChild(d); setTimeout(() => d.remove(), 3800); }
const fail = (e) => toast(e.message || 'Error', 'bad');
const ok = (m) => toast(m, 'ok');
function busy(b, on) { if (!b) return; if (on) { b.dataset.l = b.innerHTML; b.disabled = true; b.textContent = 'Please wait…'; } else { b.disabled = false; if (b.dataset.l) b.innerHTML = b.dataset.l; } }
async function act(btn, fn) { busy(btn, true); try { return await fn(); } catch (e) { fail(e); } finally { busy(btn, false); } }

/* ---------- modal */
let modalStack = [];
function modal(title, html, wide) {
  const bg = document.createElement('div'); bg.className = 'mbg';
  bg.innerHTML = `<div class="modal ${wide ? 'w' : ''}"><h3><span>${title}</span><button data-x aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></h3><div class="mb">${html}</div></div>`;
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) close(); });
  $('[data-x]', bg).onclick = () => close();
  document.body.appendChild(bg); modalStack.push(bg);
  function close() { bg.remove(); modalStack = modalStack.filter((x) => x !== bg); }
  return { el: $('.mb', bg), close };
}
const closeAll = () => { modalStack.forEach((m) => m.remove()); modalStack = []; };
function ask(title, label, ph) {
  return new Promise((res) => {
    const m = modal(title, `<div class="fld"><label>${label}</label><input id="ask-v" placeholder="${esc(ph || '')}"></div><button class="btn" id="ask-ok">Confirm</button> <button class="btn o" id="ask-no">Cancel</button>`);
    $('#ask-v', m.el).focus();
    $('#ask-ok', m.el).onclick = () => { const v = $('#ask-v', m.el).value.trim(); m.close(); res(v); };
    $('#ask-no', m.el).onclick = () => { m.close(); res(null); };
    $('#ask-v', m.el).onkeydown = (e) => { if (e.key === 'Enter') $('#ask-ok', m.el).click(); };
  });
}

/* ---------- images (client-side resize/compress) */
const IMG = {};
function compress(file, max, png, limitKB) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
      let out;
      if (png) { x.drawImage(img, 0, 0, w, h); out = c.toDataURL('image/png'); }
      if (!png || out.length * 0.75 > limitKB * 1024) { x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); out = c.toDataURL('image/jpeg', 0.82); }
      URL.revokeObjectURL(url);
      if (out.length * 0.75 > limitKB * 1024) { rej(new Error('Image is too large even after compression. Use a smaller image.')); return; }
      res(out);
    };
    img.onerror = () => rej(new Error('Could not read this image'));
    img.src = url;
  });
}
function imgField(id, label, cur, max, png, limitKB) {
  delete IMG[id];
  setTimeout(() => {
    const f = $('#' + id); if (!f) return;
    f.onchange = async () => { const file = f.files[0]; if (!file) return; try { IMG[id] = await compress(file, max, png, limitKB || 280); $('#' + id + '-p').src = IMG[id]; $('#' + id + '-p').style.display = ''; } catch (e) { fail(e); f.value = ''; } };
  });
  return `<div class="fld"><label>${label}</label><div class="imgp"><img id="${id}-p" src="${esc(cur || '')}" style="${cur ? '' : 'display:none'}" alt=""><input type="file" id="${id}" accept="image/*"></div></div>`;
}
const v = (id) => ($('#' + id) ? $('#' + id).value.trim() : '');
const chk = (id) => !!($('#' + id) && $('#' + id).checked);
const istInput = (iso) => { const s = new Date(iso).toLocaleString('sv-SE', { timeZone: 'Asia/Kolkata' }); return { d: s.slice(0, 10), t: s.slice(11, 16) }; };
const toISO = (d, t) => (d && t ? new Date(`${d}T${t}:00+05:30`).toISOString() : '');
async function download(path, name) { const r = await api(path, { raw: true }); const b = await r.blob(); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

/* ---------- shell */
const NAV = [['dashboard', 'Dashboard', 'M3 12 12 3l9 9M5 10v10h14V10'], ['games', 'Games', 'M6 12h4M8 10v4M15 13h.01M18 11h.01M17.3 5H6.7a4 4 0 0 0-3.9 3.2l-1.3 6A3 3 0 0 0 4.4 18c.8 0 1.5-.4 2-1l1.5-2h8.2l1.5 2c.5.6 1.2 1 2 1a3 3 0 0 0 2.9-3.8l-1.3-6A4 4 0 0 0 17.3 5z'],
  ['matches', 'Matches', 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z'], ['users', 'Users', 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'],
  ['deposits', 'Deposits', 'M12 5v14M5 12l7 7 7-7'], ['withdrawals', 'Withdrawals', 'M12 19V5M5 12l7-7 7 7'], ['referrals', 'Referrals', 'M20 12v10H4V12M2 7h20v5H2zM12 22V7'],
  ['content', 'Banners & Content', 'M3 3h18v18H3zM3 9h18M9 21V9'], ['leaderboard', 'Leaderboard', 'M18 20V10M12 20V4M6 20v-6'], ['logs', 'Reports & Logs', 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8'],
  ['settings', 'Settings', 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z']];
function showLogin() { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }
function doLogout(auto) { A.token = null; LS.del('hz_admin'); closeAll(); showLogin(); if (auto) toast('Session expired. Login again.', 'bad'); }
async function showApp() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#who').textContent = A.name;
  $('#nav').innerHTML = NAV.map((n) => `<button data-p="${n[0]}"><svg viewBox="0 0 24 24"><path d="${n[2]}"/></svg>${n[1]}</button>`).join('');
  api('/config').then((r) => { $('#sname').textContent = r.data.appName; if (r.data.logo) $('#slogo').innerHTML = `<img src="${esc(r.data.logo)}" alt="">`; }).catch(() => {});
  if (!location.hash) location.hash = 'dashboard'; route();
}
let rid = 0;
async function route() {
  if (!A.token) return;
  const name = (location.hash.slice(1) || 'dashboard').split('/')[0]; const p = PAGES[name] ? name : 'dashboard';
  $$('#nav button').forEach((b) => b.classList.toggle('on', b.dataset.p === p));
  $('#title').textContent = NAV.find((n) => n[0] === p)[1]; $('#side').classList.remove('open'); $('#scrim').classList.remove('on');
  const my = ++rid; const old = $('#pg'); const fresh = old.cloneNode(false); old.replaceWith(fresh); fresh.innerHTML = sk(3);
  try { await PAGES[p]($('#pg'), () => my === rid); } catch (e) { if (my === rid) $('#pg').innerHTML = emptyBox('Could not load', esc(e.message)); }
}
const PAGES = {};

/* ================= DASHBOARD ================= */
PAGES.dashboard = async (el) => {
  const d = (await api('/admin/dashboard')).data; const t = d.totals; let range = 7;
  const sum = (n, k) => d.series.slice(-n).reduce((a, s) => a + s[k], 0);
  const draw = () => {
    const s = d.series.slice(-range); const mx = Math.max(1, ...s.flatMap((x) => [x.deposits, x.entry, x.prizes])); const any = s.some((x) => x.deposits || x.entry || x.prizes || x.signups);

    c.innerHTML = `<div class="card"><h3>New announcement</h3><div class="fld"><label>Title</label><input id="a-t" maxlength="100"></div><div class="fld"><label>Message</label><textarea id="a-b" rows="3" maxlength="1000"></textarea></div><label class="sw"><input type="checkbox" id="a-n" checked> Also push to every user's notifications</label><br><button class="btn" id="a-s">Publish</button></div>` + tbl(['Date', 'Title', 'Message', 'Status', ''], a.map((x) => `<tr><td>${fmt(x.created_at)}</td><td><b>${esc(x.title)}</b></td><td>${esc(x.body)}</td><td>${bdx(x.active ? 'active' : 'cancelled', x.active ? 'active' : 'hidden')}</td><td><button class="btn sm o" data-h="${x.id}">${x.active ? 'Hide' : 'Show'}</button> <button class="btn sm r" data-d="${x.id}">Delete</button></td></tr>`), 'No announcements yet');
    $('#a-s').onclick = (e) => act(e.currentTarget, async () => { ok((await api('/admin/announcements', { method: 'POST', body: { title: v('a-t'), body: v('a-b'), notifyAll: chk('a-n') } })).message); route(); });
    c.onclick = (e) => { const t = e.target.closest('button[data-h],button[data-d]'); if (!t) return; if (t.dataset.d && confirm('Delete announcement?')) act(t, async () => { ok((await api('/admin/announcements/' + t.dataset.d, { method: 'DELETE' })).message); route(); }); if (t.dataset.h) { const x = a.find((q) => String(q.id) === t.dataset.h); act(t, async () => { ok((await api('/admin/announcements/' + x.id, { method: 'PUT', body: { title: x.title, body: x.body, active: !x.active } })).message); route(); }); } };
  } else {
    const p = (await api('/admin/promotions')).data.promotions;
    c.innerHTML = `<div class="row"><span class="sp"></span><button class="btn" id="add">+ Add Promotion</button></div>` + tbl(['Image', 'Title', 'Message', 'Order', 'Status', ''], p.map((x) => `<tr><td>${x.image ? `<img class="thumb" src="${esc(x.image)}" alt="">` : '—'}</td><td><b>${esc(x.title)}</b><br><span class="mut">${esc(x.link)}</span></td><td>${esc(x.body)}</td><td>${x.sortOrder}</td><td>${bdx(x.active ? 'active' : 'cancelled', x.active ? 'active' : 'hidden')}</td><td><button class="btn sm o" data-e="${x.id}">Edit</button> <button class="btn sm r" data-d="${x.id}">Delete</button></td></tr>`), 'No promotions yet');
    const form = (x) => { const m = modal(x ? 'Edit promotion' : 'Add promotion', `<div class="fld"><label>Title</label><input id="p-t" maxlength="80" value="${esc(x ? x.title : '')}"></div><div class="fld"><label>Message</label><textarea id="p-b" rows="3" maxlength="600">${esc(x ? x.body : '')}</textarea></div>${imgField('p-i', 'Image (optional)', x ? x.image : '', 900, false, 280)}<div class="fld"><label>Link (optional)</label><input id="p-l" value="${esc(x ? x.link : '')}"></div><div class="fld"><label>Order</label><input id="p-o" type="number" min="0" value="${x ? x.sortOrder : 0}"></div><label class="sw"><input type="checkbox" id="p-a" ${!x || x.active ? 'checked' : ''}> Visible</label><br><button class="btn" id="p-s">Save</button>`);
      $('#p-s', m.el).onclick = (e) => act(e.currentTarget, async () => { ok((await api(x ? '/admin/promotions/' + x.id : '/admin/promotions', { method: x ? 'PUT' : 'POST', body: { title: v('p-t'), body: v('p-b'), image: IMG['p-i'] || null, link: v('p-l'), sortOrder: Number(v('p-o')) || 0, active: chk('p-a') } })).message); m.close(); route(); }); };
    $('#add').onclick = () => form(null);
    c.onclick = (e) => { const t = e.target.closest('button'); if (!t) return; if (t.dataset.e) form(p.find((q) => String(q.id) === t.dataset.e)); if (t.dataset.d && confirm('Delete promotion?')) act(t, async () => { ok((await api('/admin/promotions/' + t.dataset.d, { method: 'DELETE' })).message); route(); }); };
  }
};

/* ================= LEADERBOARD ================= */
let LP = 'daily';
PAGES.leaderboard = async (el) => {
  const d = (await api('/admin/leaderboard?period=' + LP)).data;
  el.innerHTML = `<div class="row"><div class="tabs" style="margin:0" id="lt">${[['daily', 'Daily'], ['weekly', 'Weekly'], ['all', 'All-time']].map((t) => `<button data-p="${t[0]}" class="${LP === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</div><span class="sp"></span><button class="btn a" id="rs">Reset daily leaderboard</button></div>
  <p class="mut">Top 10 real users by total winnings. ${d.dailyResetAt ? 'Daily board last reset: ' + fmt(d.dailyResetAt) + '.' : ''} Resetting only affects the daily board – wallet history is never changed.</p>` + tbl(['Rank', 'Player', 'User ID', 'Winnings'], d.rows.map((r) => `<tr><td><b>${r.rank === 1 ? '👑 ' : '#'}${r.rank}</b></td><td>${esc(r.name)}</td><td>#${r.userId}</td><td><b class="pos">${inr(r.winnings)}</b></td></tr>`), 'No winners yet for this period');
  $('#lt').onclick = (e) => { const b = e.target.closest('button'); if (b) { LP = b.dataset.p; route(); } };
  $('#rs').onclick = (e) => { if (confirm('Reset the DAILY leaderboard now?')) act(e.currentTarget, async () => { ok((await api('/admin/leaderboard/reset-daily', { method: 'POST' })).message); route(); }); };
};

/* ================= LOGS ================= */
const LG = { tab: 'ledger', q: '', page: 0, type: 'all' };
PAGES.logs = async (el) => {
  el.innerHTML = `<div class="tabs" id="lt">${[['ledger', 'Wallet ledger'], ['audit', 'Admin audit log'], ['otp', 'OTP logs']].map((t) => `<button data-t="${t[0]}" class="${LG.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</div>
  <div class="row"><input class="in" id="l-q" placeholder="Search…" value="${esc(LG.q)}" style="min-width:240px">${LG.tab === 'ledger' ? `<select class="in" id="l-t">${['all', 'deposit', 'entry_fee', 'win', 'refund', 'referral_bonus', 'withdrawal', 'withdrawal_refund', 'admin_credit', 'admin_debit'].map((s) => `<option ${LG.type === s ? 'selected' : ''}>${s}</option>`).join('')}</select>` : ''}</div><div id="ll">${sk(2)}</div>`;
  const load = async () => {
    const d = (await api(`/admin/logs/${LG.tab}?q=${encodeURIComponent(LG.q)}&page=${LG.page}&type=${LG.type}`)).data; let t;
    if (LG.tab === 'ledger') t = tbl(['#', 'Date', 'User', 'Type', 'Amount', 'Dep Δ', 'Win Δ', 'Balance after (dep / win)', 'Match', 'Ref / note'], d.rows.map((r) => `<tr><td>${r.id}</td><td>${fmt(r.at)}</td><td>${esc(r.name || '#' + r.userId)}<br><span class="mut">${esc(r.mobile || 'deleted')}</span></td><td>${esc(r.type)}</td><td><b>${inr(r.amount)}</b></td><td class="${r.dep > 0 ? 'pos' : r.dep < 0 ? 'neg' : ''}">${r.dep}</td><td class="${r.win > 0 ? 'pos' : r.win < 0 ? 'neg' : ''}">${r.win}</td><td>${inr(r.depAfter)} / ${inr(r.winAfter)}</td><td>${r.matchId ? '#' + r.matchId : ''}</td><td class="mut">${esc(r.ref)}<br>${esc(r.note)}</td></tr>`), 'No ledger entries yet');
    else if (LG.tab === 'audit') t = tbl(['Date', 'Admin', 'Action', 'Details'], d.rows.map((r) => `<tr><td>${fmt(r.created_at)}</td><td>${esc(r.admin)}</td><td><b>${esc(r.action)}</b></td><td>${esc(r.details)}</td></tr>`), 'No admin actions logged yet');
    else t = tbl(['Date', 'Mobile', 'Purpose', 'Action', 'Result', 'IP', 'Provider response'], d.rows.map((r) => `<tr><td>${fmt(r.created_at)}</td><td>${esc(r.mobile)}</td><td>${esc(r.purpose)}</td><td>${esc(r.action)}</td><td>${bd(r.success ? 'success' : 'failed')}</td><td class="mono">${esc(r.ip)}</td><td class="mono" style="max-width:360px;word-break:break-all">${esc(r.raw)}</td></tr>`), 'No OTP activity yet');
    $('#ll').innerHTML = t + `<div class="row" style="margin-top:12px"><button class="btn sm o" id="pv" ${LG.page ? '' : 'disabled'}>← Prev</button><button class="btn sm o" id="nx" ${d.more ? '' : 'disabled'}>Next →</button></div>`;
    $('#pv').onclick = () => { LG.page--; load(); }; $('#nx').onclick = () => { LG.page++; load(); };
  };
  $('#lt').onclick = (e) => { const b = e.target.closest('button'); if (b) { LG.tab = b.dataset.t; LG.page = 0; LG.q = ''; route(); } };
  let tm; $('#l-q').oninput = (e) => { LG.q = e.target.value.trim(); LG.page = 0; clearTimeout(tm); tm = setTimeout(() => load().catch(fail), 350); };
  if ($('#l-t')) $('#l-t').onchange = (e) => { LG.type = e.target.value; LG.page = 0; load().catch(fail); };
  await load();
};

/* ================= global wiring ================= */
$('#lf').onsubmit = async (e) => {
  e.preventDefault(); const b = $('#lb'); busy(b, true);
  try { const r = await api('/admin/login', { method: 'POST', body: { username: $('#lu').value.trim(), password: $('#lp').value } }); A.token = r.data.token; A.name = r.data.username; LS.set('hz_admin', A.token); $('#lp').value = ''; showApp(); }
  catch (er) { fail(er); } finally { busy(b, false); }
};
$('#lo').onclick = () => doLogout(false);
$('#rf').onclick = () => route();
$('#burger').onclick = () => { $('#side').classList.toggle('open'); $('#scrim').classList.toggle('on'); };
$('#scrim').onclick = () => { $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); };
$('#nav').onclick = (e) => { const b = e.target.closest('button'); if (b) location.hash = b.dataset.p; };
window.addEventListener('hashchange', route);
$('#chpw').onclick = () => {
  const m = modal('Change admin password', `<div class="fld"><label>Current password</label><input id="c-o" type="password" autocomplete="current-password"></div><div class="fld"><label>New password (min 8 characters)</label><input id="c-n" type="password" autocomplete="new-password"></div><button class="btn" id="c-s">Change password</button>`);
  $('#c-s', m.el).onclick = (e) => act(e.currentTarget, async () => { const r = await api('/admin/password', { method: 'POST', body: { oldPassword: $('#c-o').value, newPassword: $('#c-n').value } }); A.token = r.data.token; LS.set('hz_admin', A.token); ok(r.message); m.close(); });
};
(async function boot() {
  if (!A.token) return showLogin();
  try { const r = await api('/admin/me'); A.name = r.data.username; showApp(); } catch (e) { if (e.status === 401) showLogin(); else { showLogin(); fail(e); } }
})();
</script>
</body>
